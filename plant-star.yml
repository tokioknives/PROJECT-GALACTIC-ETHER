name: plant-star
on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 */6 * * *"   # retries any painting that failed earlier
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: plant-star
  cancel-in-progress: false

jobs:
  plant:
    if: github.event_name != 'issues' || startsWith(github.event.issue.title, 'New star:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save sharp
      - id: plant
        run: node scripts/plant.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          IMAGE_AUTH: ${{ secrets.IMAGE_AUTH }}
      - name: Save to the universe
        run: |
          git config user.name "cyber-galaxy[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A universe.json stars
          git diff --cached --quiet || (git commit -m "the universe grows" && git pull --rebase && git push)
      - name: Tell the visitor
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          PLANTED: ${{ steps.plant.outputs.planted }}
        run: |
          if [ "$PLANTED" = "true" ]; then
            MSG="Your star is born. It appears in the universe within a few minutes, and it stays forever."
          else
            MSG="This star was not planted (empty, duplicate, or too many links)."
          fi
          gh issue comment "$ISSUE" --body "$MSG"
          gh issue close "$ISSUE"
