<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROJECT-GALACTIC-ETHER</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #030208;
            font-family: 'Courier New', Courier, monospace;
            color: #00ffcc;
        }
        #space-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            cursor: grab;
        }
        #space-canvas:active {
            cursor: grabbing;
        }
        /* Collapsible HUD Toggle Button */
        #hud-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 5, 25, 0.85);
            border: 2px solid #ff007f;
            color: #ff007f;
            padding: 10px 16px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
        }
        #hud-toggle:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.8);
        }
        /* Side Control Panel */
        #control-panel {
            position: absolute;
            top: 70px;
            left: 20px;
            width: 320px;
            z-index: 10;
            background: rgba(10, 5, 25, 0.9);
            border: 1px solid #00ffcc;
            padding: 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease, opacity 0.3s ease;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        #control-panel.collapsed {
            transform: translateX(-360px);
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 1.1rem;
            color: #ff007f;
            text-shadow: 0 0 8px #ff007f;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        p.desc {
            font-size: 0.75rem;
            color: #a0a0c0;
            margin-bottom: 15px;
            line-height: 1.3;
        }
        textarea {
            width: 100%;
            height: 70px;
            background: #080414;
            border: 1px solid #00ffcc;
            color: #00ffcc;
            padding: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            resize: none;
            outline: none;
            margin-bottom: 12px;
        }
        textarea:focus {
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
        button.action-btn {
            width: 100%;
            background: #00ffcc;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }
        button.action-btn:hover {
            background: #ff007f;
            color: #fff;
            box-shadow: 0 0 15px #ff007f;
        }
        button.tip-btn {
            background: transparent;
            border: 1px solid #ffcc00;
            color: #ffcc00;
        }
        button.tip-btn:hover {
            background: #ffcc00;
            color: #000;
            box-shadow: 0 0 15px #ffcc00;
        }
        /* Modal Popup for Star Art & Tip Jar */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #0d0820;
            border: 2px solid #00ffcc;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.4);
            position: relative;
        }
        .modal-content img, .modal-content canvas {
            max-width: 100%;
            border: 1px solid #ff007f;
            margin: 15px 0;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.3);
        }
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #ff007f;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .tip-input {
            width: 100%;
            padding: 8px;
            background: #140c30;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            margin: 10px 0;
            font-family: inherit;
        }
    </style>
</head>
<body>

    <button id="hud-toggle">⚡ MENU [TOGGLE]</button>

    <div id="control-panel">
        <h1>PROJECT-GALACTIC-ETHER</h1>
        <p class="desc">Inject prompt prose into the ether to forge complex celestial bodies into the eternal cosmos.</p>
        
        <textarea id="prompt-input" placeholder="Type your prose, lyrics, or anomaly prompt..."></textarea>
        <button class="action-btn" id="forge-btn">FORGE CELESTIAL STAR</button>
        <button class="action-btn tip-btn" id="open-tip-btn">⚡ TIP JAR / DONATE</button>
    </div>

    <canvas id="space-canvas"></canvas>

    <!-- Star Visual Modal -->
    <div id="art-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-art">&times;</span>
            <h2 id="modal-title" style="color:#00ffcc; font-size:1rem;">CELESTIAL ANOMALY</h2>
            <canvas id="modal-art-canvas" width="300" height="300"></canvas>
            <p id="modal-prompt" style="font-size:0.8rem; color:#a0a0c0; font-style:italic;"></p>
        </div>
    </div>

    <!-- Tip Jar Modal -->
    <div id="tip-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-tip">&times;</span>
            <h2 style="color:#ffcc00;">CYBERSPACE TIP JAR</h2>
            <p class="desc" style="margin-top:10px;">Support the infinite cosmic network! Link your crypto wallet or payment Gateway below.</p>
            <input type="text" class="tip-input" id="wallet-address" value="0x71C...GONZO_ETHER_WALLET" readonly>
            <button class="action-btn tip-btn" onclick="alert('Wallet address copied to clipboard!')">COPY WALLET ADDRESS</button>
            <a href="https://paypal.me" target="_blank" style="text-decoration:none;">
                <button class="action-btn" style="background:#ffcc00; color:#000; margin-top:5px;">DONATE VIA PAYPAL</button>
            </a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('space-canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initBackgroundStars();
        });

        // Camera Offset for infinite universe panning
        let cameraX = 0;
        let cameraY = 0;
        let isDragging = false;
        let startX, startY;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX - cameraX;
            startY = e.clientY - cameraY;
        });

        window.addEventListener('mousemove', (e) => {
            if (isDragging) {
                cameraX = e.clientX - startX;
                cameraY = e.clientY - startY;
            }
        });

        window.addEventListener('mouseup', () => isDragging = false);

        // Background Starfield Generation
        let staticStars = [];
        function initBackgroundStars() {
            staticStars = [];
            for (let i = 0; i < 400; i++) {
                staticStars.push({
                    x: (Math.random() - 0.5) * 4000,
                    y: (Math.random() - 0.5) * 4000,
                    size: Math.random() * 2,
                    alpha: Math.random(),
                    pulse: Math.random() * 0.02
                });
            }
        }
        initBackgroundStars();

        // User Generated Celestial Bodies
        let celestialBodies = [
            {
                x: 0,
                y: 0,
                radius: 40,
                prompt: "Initial Big Bang Core",
                color1: "#ff007f",
                color2: "#00ffcc",
                seed: 42,
                type: "nebula"
            },
            {
                x: 250,
                y: -180,
                radius: 28,
                prompt: "Pulsing Retro Pulsar",
                color1: "#ffcc00",
                color2: "#ff0055",
                seed: 99,
                type: "planet"
            }
        ];

        // Complex Procedural Renderer for Celestial Objects
        function drawCelestialBody(body) {
            ctx.save();
            ctx.translate(body.x + cameraX + width / 2, body.y + cameraY + height / 2);

            // Outer Glowing Atmosphere / Nebula rings
            let grad = ctx.createRadialGradient(0, 0, body.radius * 0.2, 0, 0, body.radius * 2.5);
            grad.addColorStop(0, body.color1);
            grad.addColorStop(0.5, body.color2);
            grad.addColorStop(1, 'transparent');

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(0, 0, body.radius * 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Planet Core / Detailed Surface Texture
            ctx.fillStyle = body.color1;
            ctx.beginPath();
            ctx.arc(0, 0, body.radius, 0, Math.PI * 2);
            ctx.fill();

            // Complex Pixel / Ring Patterns
            ctx.strokeStyle = body.color2;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.ellipse(0, 0, body.radius * 1.8, body.radius * 0.4, body.seed, 0, Math.PI * 2);
            ctx.stroke();

            ctx.restore();
        }

        function render() {
            ctx.fillStyle = '#030208';
            ctx.fillRect(0, 0, width, height);

            // Render Static Background Field
            ctx.save();
            ctx.translate(width / 2 + cameraX * 0.2, height / 2 + cameraY * 0.2);
            for (let star of staticStars) {
                star.alpha += star.pulse;
                if (star.alpha > 1 || star.alpha < 0.2) star.pulse = -star.pulse;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            }
            ctx.restore();

            // Render Celestial Bodies
            for (let body of celestialBodies) {
                drawCelestialBody(body);
            }

            requestAnimationFrame(render);
        }
        render();

        // UI Panel Controls
        const hudToggle = document.getElementById('hud-toggle');
        const controlPanel = document.getElementById('control-panel');
        hudToggle.addEventListener('click', () => {
            controlPanel.classList.toggle('collapsed');
        });

        // Forge New Star Functionality
        const forgeBtn = document.getElementById('forge-btn');
        const promptInput = document.getElementById('prompt-input');

        forgeBtn.addEventListener('click', () => {
            const prompt = promptInput.value.trim();
            if (!prompt) return alert('Enter a prompt to seed the celestial body!');

            const colors = [
                ['#ff007f', '#00ffcc'],
                ['#ffcc00', '#ff0055'],
                ['#7928CA', '#FF0080'],
                ['#00DFD8', '#007CF0']
            ];
            const pair = colors[Math.floor(Math.random() * colors.length)];

            const newBody = {
                x: (Math.random() - 0.5) * 1200,
                y: (Math.random() - 0.5) * 1200,
                radius: Math.floor(Math.random() * 25) + 20,
                prompt: prompt,
                color1: pair[0],
                color2: pair[1],
                seed: Math.random() * 100,
                type: 'planet'
            };

            celestialBodies.push(newBody);
            promptInput.value = '';
            alert('CELESTIAL ANOMALY FORGED INTO THE ETHER!');
        });

        // Click Detection for Celestial Bodies & Modal Popups
        canvas.addEventListener('click', (e) => {
            if (isDragging) return;
            const clickX = e.clientX - width / 2 - cameraX;
            const clickY = e.clientY - height / 2 - cameraY;

            for (let body of celestialBodies) {
                const dist = Math.hypot(clickX - body.x, clickY - body.y);
                if (dist < body.radius * 1.5) {
                    openArtModal(body);
                    break;
                }
            }
        });

        const artModal = document.getElementById('art-modal');
        const modalCanvas = document.getElementById('modal-art-canvas');
        const modalCtx = modalCanvas.getContext('2d');
        const modalPrompt = document.getElementById('modal-prompt');

        function openArtModal(body) {
            modalPrompt.textContent = `"${body.prompt}"`;
            
            // Generate detailed procedural art piece inside modal
            modalCtx.fillStyle = '#080414';
            modalCtx.fillRect(0, 0, 300, 300);

            let grad = modalCtx.createRadialGradient(150, 150, 10, 150, 150, 140);
            grad.addColorStop(0, body.color1);
            grad.addColorStop(0.5, body.color2);
            grad.addColorStop(1, '#000');
            modalCtx.fillStyle = grad;
            modalCtx.beginPath();
            modalCtx.arc(150, 150, 120, 0, Math.PI * 2);
            modalCtx.fill();

            // Complex pixel noise patterns
            for(let i = 0; i < 500; i++) {
                modalCtx.fillStyle = body.color2;
                let px = 150 + (Math.random() - 0.5) * 200;
                let py = 150 + (Math.random() - 0.5) * 200;
                modalCtx.fillRect(px, py, 2, 2);
            }

            artModal.style.display = 'flex';
        }

        document.getElementById('close-art').onclick = () => artModal.style.display = 'none';

        // Tip Jar Modal Controls
        const tipModal = document.getElementById('tip-modal');
        document.getElementById('open-tip-btn').onclick = () => tipModal.style.display = 'flex';
        document.getElementById('close-tip').onclick = () => tipModal.style.display = 'none';
    </script>
</body>
</html>
