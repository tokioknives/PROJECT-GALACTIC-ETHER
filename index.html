<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CYBER GALAXY · GONZO ETHER ENGINE</title>
<style>
:root{--bg:#030008;--fg:#00ffcc;--neon:#00ffd5;--pink:#ff0077;--acid:#ccff00;--card:#0b021a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Courier New",monospace;overflow:hidden;user-select:none}
canvas#u{position:fixed;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:grab;touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;padding:12px 16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;pointer-events:none;z-index:3}
.hud>*{pointer-events:auto}
.title{color:var(--neon);text-shadow:0 0 10px var(--neon);font-size:14px;letter-spacing:2px;font-weight:bold}
button,.btn{font:inherit;background:rgba(5,1,15,0.9);color:var(--neon);border:2px solid var(--neon);padding:8px 12px;cursor:pointer;font-size:12px;box-shadow:0 0 10px rgba(0,255,213,0.3)}
button:hover,.btn:hover{background:var(--neon);color:#000}
.pink{color:var(--pink);border-color:var(--pink);box-shadow:0 0 10px rgba(255,0,119,0.3)}
.pink:hover{background:var(--pink);color:#000}
.acid{color:var(--acid);border-color:var(--acid);box-shadow:0 0 10px rgba(204,255,0,0.3)}
.acid:hover{background:var(--acid);color:#000}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,0,8,0.9);padding:16px;z-index:10}
.overlay.on{display:flex}
.box{background:var(--card);border:2px solid var(--pink);box-shadow:0 0 30px rgba(255,0,119,0.5);max-width:460px;width:100%;padding:20px;max-height:90vh;overflow:auto}
.box h2{margin:0 0 10px;color:var(--pink);font-size:18px}
textarea{width:100%;height:120px;background:#05010f;color:var(--acid);border:2px solid var(--neon);font:inherit;padding:8px;resize:none}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#spr{width:192px;height:192px;image-rendering:pixelated;border:2px solid var(--neon);display:block;margin:0 auto 12px;background:#000}
.meta{color:var(--neon);font-size:11px;margin-bottom:6px}
#ctext{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.5;background:rgba(0,0,0,0.4);padding:8px;border-left:3px solid var(--acid)}
.hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:11px;opacity:0.7;pointer-events:none;color:var(--acid)}
</style>
</head>
<body>
<canvas id="u"></canvas>
<div class="hud">
  <div class="title">&#9733; GALACTIC ETHER <span id="count"></span></div>
  <div style="display:flex;gap:8px">
    <button id="findBtn">&#128125; TRACK ENTITY</button>
    <button class="pink" id="plantBtn">+ PLANT STAR</button>
  </div>
</div>
<div class="hint">DRAG TO NAVIGATE · CLICK OBJECTS TO OPEN TRANSMISSION</div>

<div class="overlay on" id="intro"><div class="box" style="text-align:center;border-color:var(--neon)">
  <h2 style="color:var(--neon)">PROJECT GALACTIC ETHER</h2>
  <p style="font-size:13px">The local browser matrix is active. Step into the electric void.</p>
  <button id="enter" class="acid" style="width:100%;margin-top:10px">&gt; INITIALIZE SYSTEM &lt;</button>
</div></div>

<div class="overlay" id="plant"><div class="box">
  <h2>Feed the Ethernet</h2>
  <p style="font-size:12px">Type your diary page, poem, or chaos manifesto. The local engine will materialize it.</p>
  <textarea id="txt" placeholder="Write into the dark..."></textarea>
  <div class="row"><button class="pink" id="go">BIRTH STAR</button><button id="cancel1">CANCEL</button></div>
</div></div>

<div class="overlay" id="card"><div class="box">
  <canvas id="spr" width="192" height="192"></canvas>
  <h2 id="cname"></h2>
  <div class="meta" id="cmeta"></div>
  <div id="ctext"></div>
  <div class="row" id="crow"><button id="cclose" class="acid" style="width:100%">CLOSE TRANSMISSION</button></div>
</div></div>

<script>
const $=id=>document.getElementById(id);
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rngFrom(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const TYPES=["star","planet","comet","galaxy","pulsar"];

function interpret(text){
  const seed=hash(text), r=rngFrom(seed);
  let sum=0; for(const c of text) sum+=c.charCodeAt(0);
  const hue=sum%360, pal=[0,1,2,3].map(i=>`hsl(${(hue+i*55)%360} 100% ${50+i*10}%)`);
  const N=24, grid=[];
  forlet y=0;y<N;y++=[];forlet x=0;x<N/2;x++[x]=r()<0.4?1+Math.floor(r()*4):0}}
  const A=["VEX","LUM","KRY","NYX","SYN","PYR"], B=["IVEX","ORA","ETH","ARIA","ONYX"];
  const name=A[seed%A.length]+B[(seed>>>3)%B.length]+"-"+((seed>>>6)%99+1);
  return {seed, type:TYPES[seed%TYPES.length], hue, grid, pal, name};
}

function drawSprite(cv, art){
  const c=cv.getContext("2d"); c.clearRect(0,0,192,192);
  for(let y=0;y<24;y++)for(let x=0;x<12;x++){
    const v=art.grid[y][x]; if(!v)continue;
    c.fillStyle=art.pal[v-1]; c.fillRect(x*8,y*8,8,8); c.fillRect((23-x)*8,y*8,8,8);
  }
}

let objs=[];
const SEEDS=[
  {text:"The first spark in the local matrix.", t:"2026-01-01"},
  {text:"Static whispering through empty fiber channels.", t:"2026-01-02"}
];
function getLocal(){try{return JSON.parse(localStorage.getItem("cg_local_stars")||"[]")}catch(e){return[]}}
function setLocal(a){try{localStorage.setItem("cg_local_stars",JSON.stringify(a))}catch(e){}}

function place(o){
  const a=interpret(o.text), r=rngFrom(a.seed);
  const ang=r()*Math.PI*2, d=200+r()*600;
  return Object.assign({}, o, a, {x:Math.cos(ang)*d, y:Math.sin(ang)*d, sp:0.3+r()*0.5, ph:r()*6.28});
}

function rebuild(){
  const seen=new Set(), all=[];
  for(const o of [...SEEDS, ...getLocal()]){
    if(!o.text||seen.has(o.text))continue; seen.add(o.text); all.push(place(o));
  }
  objs=all; $("count").textContent="· "+objs.length+" stars";
}

const cv=$("u"), ctx=cv.getContext("2d");
const PX=2; let W,H;
function resize(){W=Math.ceil(innerWidth/PX);H=Math.ceil(innerHeight/PX);cv.width=W;cv.height=H}
addEventListener("resize",resize); resize();
const cam={x:0,y:0,tx:null,ty:null};

function glow(x,y,r,col){
  ctx.fillStyle=col;
  for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(dx*dx+dy*dy<=r*r)ctx.fillRect(x+dx,y+dy,1,1);
}

function frame(ms){
  const t=ms/1000;
  if(cam.tx!==null){cam.x+=(cam.tx-cam.x)*.08;cam.y+=(cam.ty-cam.y)*.08;if(Math.hypot(cam.tx-cam.x,cam.ty-cam.y)<1)cam.tx=null;}
  ctx.fillStyle="#030008"; ctx.fillRect(0,0,W,H);
  
  for(const o of objs){
    const x=Math.round(o.x-cam.x+W/2), y=Math.round(o.y-cam.y+H/2);
    if(x<-40||y<-40||x>W+40||y>H+40)continue;
    glow(x,y,4,o.pal[0].replace(")"," / .3)"));
    ctx.fillStyle=o.pal[1]; ctx.fillRect(x,y,2,2);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let drag=null;
cv.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false};cam.tx=null;cv.setPointerCapture(e.pointerId)});
cv.addEventListener("pointermove",e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>5)drag.moved=true;cam.x=drag.cx-(e.clientX-drag.x)/PX;cam.y=drag.cy-(e.clientY-drag.y)/PX});
cv.addEventListener("pointerup",e=>{
  if(!drag)return;
  if(!drag.moved){
    const wx=e.clientX/PX-W/2+cam.x, wy=e.clientY/PX-H/2+cam.y;
    let best=null,bd=20;
    for(const o of objs){const d=Math.hypot(o.x-wx,o.y-wy);if(d<bd){bd=d;best=o}}
    if(best)openCard(best);
  }
  drag=null;
});

function openCard(o){
  drawSprite($("spr"),o);
  $("cname").textContent=o.name;
  $("cmeta").textContent=o.type.toUpperCase()+" · BORN "+(o.t||"2026");
  $("ctext").textContent=o.text;
  $("card").classList.add("on");
}

$("findBtn").onclick=()=>{if(objs.length){const o=objs[Math.floor(Math.random()*objs.length)];cam.tx=o.x;cam.ty=o.y}};
$("cclose").onclick=()=>$("card").classList.remove("on");
$("enter").onclick=()=>$("intro").classList.remove("on");
$("plantBtn").onclick=()=>$("plant").classList.add("on");
$("cancel1").onclick=()=>$("plant").classList.remove("on");
$("go").onclick=()=>{
  const text=$("txt").value.trim(); if(text.length<3)return;
  const l=getLocal(); l.push({text,t:new Date().toISOString().slice(0,10)});
  setLocal(l); rebuild(); $("txt").value=""; $("plant").classList.remove("on");
  cam.tx=objs[objs.length-1].x; cam.ty=objs[objs.length-1].y;
};
rebuild();
</script>
</body>
</html>
