name: gods
on:
  schedule:
    - cron: "40 */12 * * *"   # twice a day, one god creates a world
  workflow_dispatch:           # press "Run workflow" to test right now

permissions:
  contents: write

concurrency:
  group: plant-star
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save sharp
      - name: A god fuses stars
        run: node scripts/gods.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      - name: Paint it, name it, give it a song
        run: node scripts/plant.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          IMAGE_URL: ${{ secrets.IMAGE_URL }}
          IMAGE_AUTH: ${{ secrets.IMAGE_AUTH }}
      - name: A god visits a world and leaves a gift
        run: node scripts/gods-play.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
      - name: Save to the universe
        run: |
          git config user.name "cyber-galaxy[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add -A universe.json stars miracles.json
          git diff --cached --quiet || (git commit -m "a god made a world" && git pull --rebase && git push)
